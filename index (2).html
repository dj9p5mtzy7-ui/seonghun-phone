R.nv=()=>`<div class=s style="background:#eef1f7"><div class=ls style="padding-bottom:100px"><div style="display:flex;align-items:center;justify-content:space-between;padding:10px 18px"><div style="display:flex;gap:14px;align-items:center"><span style="font-size:28px;line-height:1">☰</span><span style="width:32px;height:32px;border:2px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">pay</span></div><div style="position:relative"><svg viewBox="0 0 24 24" width=30 height=30><path d="M12 3a6 6 0 00-6 6v4l-2 3h16l-2-3V9a6 6 0 00-6-6zM10 19a2 2 0 004 0" fill="none" stroke="#222" stroke-width="1.8" /></svg><span style="position:absolute;top:-4px;right:-6px;background:#ff3b30;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">1</span></div></div><div style="position:relative;margin:34px 16px 0"><span style="position:absolute;right:6px;top:-30px;background:#fff;border:1.5px solid #bfe3ff;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:700;color:#0a9bd8">AI탭에서 대화하기</span><div onclick="go('nvs')" style="background:#fff;border-radius:34px;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 14px #0001;cursor:pointer"><b style="color:#03c75a;font-size:34px;font-family:Arial Black,Arial,sans-serif;font-weight:900">N</b><div style="display:flex;align-items:center;gap:12px"><span style="width:30px;height:30px;border:3px solid #1ec8c8;border-radius:9px;display:inline-flex;align-items:center;justify-content:center"><i style="width:10px;height:10px;border-radius:50%;background:#1ec8c8"></i></span><i style="width:1px;height:26px;background:#ddd"></i><svg viewBox="0 0 24 24" width=32 height=32><path d="M12 2c5 3 6 9 0 10C6 11 7 5 12 2z" fill="#2f80ed" /><path d="M2 12c3-5 9-6 10 0-1 6-7 5-10 0z" fill="#27c3a8" /><path d="M22 12c-3 5-9 6-10 0 1-6 7-5 10 0z" fill="#27 R.nvs=()=>{const l=nvc?NV.slice(0,3):NV;return`<div class=s style="background:#fff"><div style="margin:10px 14px;display:flex;align-items:center;gap:12px;background:#f5f5f5;border-radius:30px;padding:14px 18px"><b onclick="go('nv')" style="font-size:26px;font-weight:300;cursor:pointer">←</b><input id=nvi placeholder="검색어를 입력해 주세요" style="flex:1;min-width:0;border:0;background:none;font-size:17px;outline:0" onkeydown="if(event.key=='Enter')nvq()"><svg onclick="nvq()" viewBox="0 0 24 24" width=30 height=30 style="cursor:pointer"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#3cc48a" stroke-width="2.4" /><path d="M15.5 15.5L21 21" stroke="#3cc3c8" stroke-width="2.6" stroke-linecap="round" /></svg></div><div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px"><b style="font-size:18px">최근 검색어</b><span style="color:#999;font-size:15px;cursor:pointer" onclick="NV.length=0;go('nvs')">전체삭제</span></div><div class=ls>${l.map((t,i)=>`<div class=r style="border:0;padding:12px 18px" onclick="nvp(${i})"><span style="width:44px;height:44px;border-radius:50%;background:#f3f3f3;display:flex;align-items:center;justify-content:center;flex:none"><svg viewBox="0 0 24 24" width=24 height=24><circle cx="12" cy="12" r="8.5" fill="none" stroke="#888" stroke-width="1.8" /><path d="M12 7v5l3 2" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" /></svg></span><div style="font-size:19px;color:#111">${t}</div><small style="font-size:17px;color:#999">${nvd(t)}</small><b onclick="event.stopPropagation();NV.splice(${i},1);go('nvs')" style="color:#999;font-size:22px;font-weight:300;margin-left:6px;cursor:pointer">✕</b></div>`).join('')}<div style="text-align:center;margin:14px 18px;border-top:1px solid #eee;position:relative;height:30px"><span onclick="nvc=!nvc;go('nvs')" style="position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:#fff;border:1px solid #ddd;border-radius:22px;padding:10px 26px;font-size:18px;cursor:pointer">${nvc?'더보기 ⌄':'접기 ⌃'}</span></div></div></div>`};
function nvp(i){const t=(nvc?NV.slice(0,3):NV)[i];$('#nvi').value=t}
function nvq(){const e=$('#nvi'),t=e&&e.value.trim();if(!t)return;const i=NV.indexOf(t);if(i>-1)NV.splice(i,1);NV.unshift(t);go('nvs')}
const SEEN={};const LK={};function tg(el,k){LK[k]=!LK[k];el.textContent=LK[k]?'♥':'♡';el.style.color=LK[k]?'#ed4956':'';const n=el.nextElementSibling;if(n&&n.dataset.c)n.textContent=+n.dataset.c+(LK[k]?1:0)}
const hrt=q=>`<span style="font-size:24px;cursor:pointer;${LK[q]?'color:#ed4956':''}" onclick="tg(this,'${q}')">${LK[q]?'♥':'♡'}</span> <span data-c=128>${128+(LK[q]?1:0)}</span>`;
const IG=[{id:'jay.pjs',n:'제이',st:X[0],bio:'',ps:[X[0],X[1]],cp:['',''],txt:''},{id:'pyeonyuk.prince',n:'편육왕자',st:P[1],bio:'',ps:[1,2,3].map(i=>P[i]),cp:['','','']}];

const post=(i,k)=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 12px" onclick="go('ip',${i})"><span class=av style="width:32px;height:32px;border-radius:50%;background:#7ad9cf"></span><b style="font-size:14px">${IG[i].id}</b></div><img src="${IG[i].ps[k]}" style="width:100%;aspect-ratio:4/5;object-fit:cover"><div style="padding:8px 12px 80px;font-size:14px;line-height:1.7">${hrt(i+'-'+k)}　○ 6　➤<br><b>${IG[i].id}</b> ${IG[i].cp[k]||''}<br><small style="color:#888">2시간 전</small></div>`;

R.po=a=>`<div class="s ig"><div class=hd><b onclick="go('ip',${a[0]})">‹</b><span>게시물</span><b></b></div><div class=ls>${post(a[0],a[1])}</div></div>`;

R.wt=()=>{const hr=[['지금','☁',15],['오후 10시','☁',14],['오후 11시','☾',14],['오전 12시','☾',13],['오전 1시','☁',13],['오전 2시','☾',12]],dy=[['오늘','☁ 45%',12,21],['목','☀',11,19],['금','☁',12,20],['토','☂ 65%',13,20],['일','☂',13,20]],bar=(a,b)=>`<div class=bar><i style="left:${(a-10)/14*100}%;width:${(b-a)/14*100}%"></i></div>`;return`<div class="s wtr"><div style="text-align:center;margin-top:30px;font-size:15px">나의 위치</div><div style="text-align:center;font-size:38px">서울</div><div style="text-align:center;font-size:96px;font-weight:200;line-height:1.1">15°</div><div style="text-align:center;font-size:17px;font-weight:500;margin-bottom:30px">대체로 흐림<br>최고:21° 최저:12°</div><div class=cd><b>기상 상태</b><br><small style="opacity:.6">온도(°C)</small><div class=hr>${hr.map(x=>`<div><b>${x[0]}</b><span style="font-size:22px">${x[1]}</span><b>${x[2]}°</b></div>`).join('')}</div></div><div class=cd>${dy.map(d=>`<div class=dr><b>${d[0]}</b><span>${d[1]}</span><small style="opacity:.6">${d[2]}°</small>${bar(d[2],d[3])}<b>${d[3]}°</b></div>`).join('')}</div><div class=wb><span>▦</span><em>➤ ● ● ● ●</em><span>☰</span></div></div>`};
let tm=[];function go(id,a){tm.forEach(clearTimeout);tm=[];$('#c').innerHTML=(R[id]||R.home)(a);if(id=='kc')$('#ms').scrollTop=1e5;if(id=='nvs'){const e=$('#nvi');if(e)e.focus()}}go('lk');
